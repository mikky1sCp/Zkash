model:
  n_in: 64
  n_out: 8
  dim: 512
  hidden: 486
  depth: 20
  p_drop: 0.0

data:
  n_samples: 2048
  n_classes: 8
  noise: 1.5
  center_scale: 0.3
  label_noise: 0.0
  seed: 0

train:
  device: auto
  epochs: 60
  patience: 10
  min_delta: 0.0
  batch_size: 128
  lr: 1.0e-3
  weight_decay: 1.0e-4
  seed: 0
  schedule: constant

paths:
  checkpoint: checkpoints/zkash10m_hard.pt