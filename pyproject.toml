[project]
name = "zkash"
version = "2.0.0"
description = "Zkash: minimal neural networks with exact parameter budgets"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]