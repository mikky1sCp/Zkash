[project]
name = "zkash10m"
version = "1.0.0"
description = "Zkash10M: a 10M-parameter residual network for education"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]